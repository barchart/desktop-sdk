name: Release

# On each push to main, release-please keeps a release PR open for each package with changes since its last release: the
# next version, from the conventional commits that touched the package's folder, and their entries in its CHANGELOG.md.
# Merging one tags that package's release (js-v…, python-v…) and creates its GitHub release; the jobs below then build
# and publish that version. They run here because a release created with GITHUB_TOKEN doesn't trigger other workflows.
#
# Building and publishing are separate jobs, so dependency code never runs where write access or the registries'
# credentials are: the build jobs install, check and build with read-only access and no secrets; the others only
# download what was built, without checking out, installing or running the project's code.
#
# js/: the version is staged on npm, not published. It goes public once a maintainer approves it on npmjs.com (or with
# `npm stage approve`) with 2FA. That's the one manual step, kept outside GitHub so that a compromised repository can't
# release anything. npm's trusted publisher for this package allows staging only.
#
# python/: the wheel and sdist are attached to the GitHub release, then published to PyPI, which trusts this workflow
# through OIDC (trusted publishing, no token) in the `pypi` environment. Its required reviewers approve each release: the
# one manual step.
#
# Actions are pinned to commit SHAs (a tag can be moved to other code); the comment names the version.
on:
    push:
        branches: [main]

permissions: {}

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            js_release_created: ${{ steps.release.outputs['js--release_created'] }}
            python_release_created: ${{ steps.release.outputs['python--release_created'] }}
            python_tag_name: ${{ steps.release.outputs['python--tag_name'] }}
        steps:
            # release-please-config.json and .release-please-manifest.json
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release

    js-build:
        needs: release-please
        if: ${{ needs.release-please.outputs.js_release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: js
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: js/.node-version
            - run: corepack enable
            # dependencies' install scripts are off (js/.yarnrc.yml)
            - run: yarn install --immutable
            - run: yarn check
            - run: yarn pack --out package.tgz
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: js-package
                  path: js/package.tgz
                  if-no-files-found: error
                  retention-days: 1

    js-publish:
        needs: js-build
        runs-on: ubuntu-latest
        # npm's trusted publisher names this environment, so the job must keep it; it requires no approval on GitHub
        environment: npm
        permissions:
            id-token: write # npm trusted publishing and provenance
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: js-package
            # an exact Node version: its npm (11.19.1) has `npm stage`, which a runner's cached 24.x may not; trusted
            # publishing (OIDC) needs no token
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.22.1
                  registry-url: https://registry.npmjs.org
            # public, with provenance (publishConfig in the tarball's package.json)
            - run: npm stage publish package.tgz --ignore-scripts

    python-build:
        needs: release-please
        if: ${{ needs.release-please.outputs.python_release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: python
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.6"
                  python-version: "3.11"
                  enable-cache: false
            - run: uv sync --locked
            # everything CI checks, then the API reference into the package and the wheel and sdist into dist/
            - run: sh scripts/check.sh
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: python-dist
                  path: python/dist/
                  if-no-files-found: error
                  retention-days: 1

    python-attach:
        needs: [release-please, python-build]
        runs-on: ubuntu-latest
        permissions:
            contents: write # upload to the release
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: python-dist
                  path: dist
            # the runner's gh, on the release release-please just created
            - run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.release-please.outputs.python_tag_name }}

    python-publish:
        needs: python-build
        runs-on: ubuntu-latest
        # PyPI's trusted publisher names this environment; its required reviewers approve each release
        environment: pypi
        permissions:
            id-token: write # PyPI trusted publishing and attestations
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: python-dist
                  path: dist
            - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
