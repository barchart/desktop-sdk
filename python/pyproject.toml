[project]
name = "barchart-desktop-sdk"
version = "0.0.0"
description = "Live quotes, order books and cumulative volume from Openfeed, kept up to date for you."
readme = "README.md"
license = "LicenseRef-Barchart"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["openfeed", "market-data", "trading", "barchart"]
# 1.5.0 is the first openfeed with the current protos and type stubs
dependencies = [
    "openfeed>=1.5.0",
    "protobuf>=6.33.3",
    "websocket-client>=1.9.2",
]

[project.urls]
Repository = "https://github.com/barchart/desktop-sdk"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-protobuf==7.35.1.20260906",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["llms.txt", "examples/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings where they say something, not on every function
    "COM812",  # conflicts with the formatter
    "PLR2004", # magic values are the point of the tests
    "FBT001",  # the reducers take their flags as positional booleans
    "FBT002",
    "TD",      # TODOs are allowed
    "FIX",
    "CPY001",  # the LICENSE file covers the package
]

[tool.ruff.lint.mccabe]
# as the JS repo's ESLint `complexity`
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# ANN401: protobuf's constructors take nested dicts, so tests write messages as dicts
# S105-S107: the tests' tokens and passwords are made up
"tests/**" = ["S101", "S105", "S106", "S107", "INP001", "N802", "SLF001", "ANN401"]
# examples print what they get, have placeholder passwords, and aren't a package
"examples/**" = ["T201", "S106", "INP001"]
# scripts report what's wrong on stderr, and aren't a package
"scripts/**" = ["T201", "INP001"]
# RawAccess and Diagnostics are parts of the SDK, in its own module
# BLE001: listeners and the client can raise anything, and that mustn't end the thread running them
"src/barchart_desktop_sdk/_sdk.py" = ["SLF001", "BLE001"]
"src/barchart_desktop_sdk/_subscriber.py" = ["BLE001"]
"src/barchart_desktop_sdk/_connection.py" = ["BLE001"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
# the Openfeed client class has no annotations: tests/test_live.py runs these calls against a real socket
untyped_calls_exclude = ["openfeed.openfeed_client"]
